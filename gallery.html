<script>
function loadLightboxImage() {
    const id = location.hash.slice(1);
    if (!id) return;
    const img = document.querySelector('#' + CSS.escape(id) + ' img[data-src]');
    if (img) {
        img.src = img.dataset.src;
        delete img.dataset.src;
    }
}
window.addEventListener('hashchange', loadLightboxImage);
window.addEventListener('load', loadLightboxImage);
if (location.hash) loadLightboxImage();
</script>
